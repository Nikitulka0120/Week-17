# Global and service configuration values

postgres:
  image:
    repository: postgres
    tag: 15-alpine
  user: user
  password: password
  dbName: main_db
  persistence:
    size: 1Gi
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

logSvc:
  image:
    repository: product-popularity-log-svc
    tag: latest
  replicaCount: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

backend:
  image:
    repository: product-popularity-backend
    tag: latest
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

frontend:
  image:
    repository: product-popularity-frontend
    tag: latest
  replicaCount: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

ingress:
  enabled: true
  className: nginx
  host: localhost
