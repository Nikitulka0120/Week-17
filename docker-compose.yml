version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: main_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d main_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  log-svc:
    build:
      context: .
      dockerfile: log-svc/Dockerfile
    container_name: log-svc
    restart: unless-stopped

  db-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: db-init
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/main_db
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "init_db.py"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/main_db
      - LOG_SVC_HOST=log-svc:50051
    depends_on:
      postgres:
        condition: service_healthy
      log-svc:
        condition: service_started
      db-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
