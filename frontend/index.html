<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Статистика товаров</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        padding: 20px;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
      }

      h1 {
        color: #1a1a2e;
        text-align: center;
        margin-bottom: 8px;
        font-size: 26px;
      }

      h2 {
        color: #333;
        margin: 24px 0 12px;
        font-size: 18px;
        border-left: 4px solid #1565c0;
        padding-left: 10px;
      }

      /* WebRTC статус */
      .rtc-status {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
        margin-bottom: 20px;
        font-size: 14px;
        color: #555;
      }
      .rtc-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #aaa;
        transition: background 0.3s;
      }
      .rtc-dot.connecting { background: #f39c12; }
      .rtc-dot.synced     { background: #27ae60; }
      .rtc-dot.offline    { background: #aaa; }

      /* Карточки панели */
      .card {
        background: white;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      }

      /* Фильтр категорий */
      .filter-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .filter-row label { font-weight: bold; font-size: 14px; }
      .filter-row select {
        padding: 6px 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }

      /* Форма добавления товара */
      .add-form {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: flex-end;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .form-group label { font-size: 12px; color: #666; font-weight: bold; }
      .form-group input {
        padding: 7px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        width: 140px;
      }
      .form-group input[type="number"] { width: 90px; }

      /* Кнопки */
      .btn {
        padding: 7px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        transition: opacity 0.15s;
      }
      .btn:hover { opacity: 0.85; }
      .btn-blue   { background: #1565c0; color: white; }
      .btn-red    { background: #e53935; color: white; }
      .btn-gray   { background: #78909c; color: white; }
      .btn-green  { background: #2e7d32; color: white; }
      .btn-orange { background: #e65100; color: white; }
      .btn-sm { padding: 4px 10px; font-size: 12px; }

      /* Результат операции */
      #op-result {
        margin-top: 10px;
        font-size: 13px;
        min-height: 18px;
      }

      /* Графики */
      .charts-row {
        display: flex;
        gap: 20px;
        margin-top: 4px;
      }
      .chart-box {
        flex: 1;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        padding: 14px;
      }
      .chart-box h3 { font-size: 14px; color: #555; margin-bottom: 10px; }
      canvas { width: 100% !important; }

      /* Таблица */
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      thead th {
        background-color: #1565c0;
        color: white;
        padding: 9px 10px;
        text-align: left;
      }
      td {
        padding: 7px 10px;
        border-bottom: 1px solid #eeeeee;
        vertical-align: middle;
      }
      tr:nth-child(even) { background-color: #f9f9f9; }
      tr:hover { background-color: #eef2ff; }

      .actions-cell {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      /* Лайки */
      .like-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .like-row input[type="number"] {
        padding: 6px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        width: 80px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Статистика товаров</h1>

      <div class="rtc-status">
        <div class="rtc-dot offline" id="rtc-dot"></div>
        <span id="rtc-label">WebRTC: не подключён</span>
      </div>

      <div class="card">
        <div class="filter-row">
          <label for="category-filter">Фильтр по категории:</label>
          <select id="category-filter" onchange="onFilterChange()">
            <option value="all">Все категории</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="charts-row">
          <div class="chart-box">
            <h3>Просмотры (топ-7)</h3>
            <canvas id="chart-views" height="250"></canvas>
          </div>
          <div class="chart-box">
            <h3>Лайки (топ-7)</h3>
            <canvas id="chart-likes" height="250"></canvas>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Добавить товар</h2>
        <div class="add-form">
          <div class="form-group">
            <label>Название</label>
            <input type="text" id="new-name" placeholder="Название" />
          </div>
          <div class="form-group">
            <label>Категория</label>
            <input type="text" id="new-category" placeholder="Категория" />
          </div>
          <div class="form-group">
            <label>Просмотры</label>
            <input type="number" id="new-views" placeholder="0" min="0" value="0" />
          </div>
          <div class="form-group">
            <label>Лайки</label>
            <input type="number" id="new-likes" placeholder="0" min="0" value="0" />
          </div>
          <button class="btn btn-blue" onclick="createProduct()">Добавить</button>
        </div>
        <div id="op-result"></div>
      </div>

      <div class="card">
        <h2>Управление лайками</h2>
        <div class="like-row">
          <input type="number" id="like-id" min="1" placeholder="ID товара" />
          <button class="btn btn-red" onclick="sendLike()">❤️ Лайк</button>
          <button class="btn btn-gray" onclick="removeLike()">🗑 Убрать лайк</button>
          <span id="like-result" style="font-size:13px;"></span>
        </div>
      </div>

      <div class="card">
        <h2>Все товары</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Название</th>
              <th>Категория</th>
              <th>Просмотры</th>
              <th>Лайки</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="6">Загрузка...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
